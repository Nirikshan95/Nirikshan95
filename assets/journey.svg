<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Engineering journey timeline 2018 to 2025"><style>
text{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.name{font-size:108px;font-weight:800;fill:#ECECE6;letter-spacing:2px}
.ember{fill:#E4FF4A}
.kick{font-size:15px;font-weight:700;letter-spacing:4px;fill:#8A8F99}
.sub{font-size:24px;fill:#ECECE6;opacity:.85}
.mono{font-family:Consolas, 'Courier New', monospace}
.h2{font-size:44px;font-weight:800;fill:#ECECE6}
.h3{font-size:24px;font-weight:700;fill:#ECECE6}
.p{font-size:17px;fill:#ECECE6;opacity:.86}
.p14{font-size:14px;fill:#ECECE6;opacity:.8}
.m{font-size:14px;fill:#8A8F99}
.b{font-size:19px;font-weight:700;fill:#ECECE6}
