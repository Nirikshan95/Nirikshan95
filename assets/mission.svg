<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Mission statement and philosophy"><style>
text{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.name{font-size:108px;font-weight:800;fill:#ECECE6;letter-spacing:2px}
.ember{fill:#E4FF4A}
.kick{font-size:15px;font-weight:700;letter-spacing:4px;fill:#8A8F99}
.sub{font-size:24px;fill:#ECECE6;opacity:.85}
.mono{font-family:Consolas, 'Courier New', monospace}
.h2{font-size:44px;font-weight:800;fill:#ECECE6}
.h3{font-size:24px;font-weight:700;fill:#ECECE6}
.p{font-size:17px;fill:#ECECE6;opacity:.86}
.p14{font-size:14px;fill:#ECECE6;opacity:.8}
.m{font-size:14px;fill:#8A8F99}
.b{font-size:19px;font-weight:700;fill:#ECECE6}
.stat{font-size:40px;font-weight:800;fill:#ECECE6}
.card{fill:#1A1C20;stroke:#30333A;stroke-width:1}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(470px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes tp{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
@keyframes sl{0%{opacity:0}1%{opacity:1}28%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.blob{animation:drift 16s ease-in-out infinite alternate}
.b2{animation-duration:22s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-70px,44px)}}
.flow{animation:flowm 6s linear infinite}
@keyframes flowm{from{stroke-dashoffset:0}to{stroke-dashoffset:-188}}
.rise{animation:rise 1s ease-out both}
.scan{opacity:.45;animation:scan 7s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 38s linear infinite}
.typ{opacity:0;animation:tp 12s ease-in-out infinite}
.sl{opacity:0;animation:sl 12s ease-in-out infinite}
.prog{transform-box:fill-box;transform-origin:left center;animation:prog 12s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out forwards}
.node{opacity:0;animation:fadeup .8s ease-out forwards}
</style><defs><linearGradient id="gcm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2026"/><stop offset="1" stop-color="#101113"/></linearGradient><radialGradient id="gam"><stop offset="0" stop-color="#E4FF4A" stop-opacity=".34"/><stop offset="1" stop-color="#E4FF4A" stop-opacity="0"/></radialGradient><radialGradient id="gbm"><stop offset="0" stop-color="#A7B8A4" stop-opacity=".30"/><stop offset="1" stop-color="#A7B8A4" stop-opacity="0"/></radialGradient><pattern id="grm" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 36L36 0" fill="none" stroke="#23262C" stroke-width="1"/></pattern><filter id="gnm" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="1200" height="340" rx="0" fill="url(#gcm)"/><rect width="1200" height="340" rx="0" fill="url(#grm)" opacity=".9"/><circle class="blob" cx="1008" cy="41" r="600" fill="url(#gam)"/><circle class="blob b2" cx="120" cy="333" r="552" fill="url(#gbm)"/><rect width="1200" height="340" rx="0" fill="#000" filter="url(#gnm)" opacity=".08"/><rect x="0.5" y="0.5" width="1199" height="339" rx="0" fill="none" stroke="#30333A" stroke-width="1"/><text class="kick" x="64" y="62">07 · MISSION</text><text class="h2" x="64" y="132" style="font-size:40px">Transforming complex data into intelligent solutions,</text><text class="h2 ember" x="64" y="184" style="font-size:40px">one model at a time.</text><text class="m" x="64" y="228" style="font-size:18px">Committed to pushing the boundaries of AI and machine learning to solve real-world challenges.</text><line x1="64" x2="1136" y1="262" y2="262" stroke="#30333A"/><text x="64" y="302" font-size="22" font-style="italic" fill="#ECECE6">"In the world of AI, every line of code is a step towards understanding intelligence itself."</text><text class="kick" x="64" y="326" style="fill:#E4FF4A">MAHESH KETAM</text></svg>
