aning, Visualization (Matplotlib, Seaborn)</text><rect x="560" y="312" width="520" height="12" rx="6" fill="#2A2D33"/><rect class="grow" style="animation-delay:0.36s" x="560" y="312" width="442.0" height="12" rx="6" fill="url(#bar)"/><text class="b" x="1136" y="324" text-anchor="end">85%</text><line x1="64" x2="1136" y1="352" y2="352" stroke="#30333A"/><text class="b" x="64" y="386">Agentic AI</text><text class="m" x="64" y="408">LangGraph, Reflection Agents, Custom Toolchains</text><rect x="560" y="376" width="520" height="12" rx="6" fill="#2A2D33"/><rect class="grow" style="animation-delay:0.48s" x="560" y="376" width="416.0" height="12" rx="6" fill="url(#bar)"/><text class="b" x="1136" y="388" text-anchor="end">80%</text><line x1="64" x2="1136" y1="416" y2="416" stroke="#30333A"/><text class="b" x="64" y="450">AI Deployment</text><text class="m" x="64" y="472">FastAPI, Docker, Hugging Face Spaces, Streamlit</text><rect x="560" y="440" width="520" height="12" rx="6" fill="#2A2D33"/><rect class="grow" style="animation-delay:0.60s" x="560" y="440" width="390.0" height="12" rx="6" fill="url(#bar)"/><text class="b" x="1136" y="452" text-anchor="end">75%</text><line x1="64" x2="1136" y1="480" y2="480" stroke="#30333A"/><text class="b" x="64" y="514">MLOps and Tools</text><text class="m" x="64" y="536">Git, DVC, MLflow (basic), CI/CD</text><rect x="560" y="504" width="520" height="12" rx="6" fill="#2A2D33"/><rect class="grow" style="animation-delay:0.72s" x="560" y="504" width="364.0" height="12" rx="6" fill="url(#bar)"/><text class="b" x="1136" y="516" text-anchor="end">70%</text><line x1="64" x2="1136" y1="544" y2="544" stroke="#30333A"/><text class="b" x="64" y="578">Web Search and APIs</text><text class="m" x="64" y="600">Google Search API, SerpAPI, REST APIs</text><rect x="560" y="568" width="520" height="12" rx="6" fill="#2A2D33"/><rect class="grow" style="animation-delay:0.84s" x="560" y="568" width="364.0" height="12" rx="6" fill="url(#bar)"/><text class="b" x="1136" y="580" text-anchor="end">70%</text><line x1="64" x2="1136" y1="608" y2="608" stroke="#30333A"/><text class="b" x="64" y="642">Soft Skills</text><text class="m" x="64" y="664">Communication, Teamwork, Documentation, Learning Agility</text><rect x="560" y="632" width="520" height="12" rx="6" fill="#2A2D33"/><rect class="grow" style="animation-delay:0.96s" x="560" y="632" width="338.0" height="12" rx="6" fill="url(#bar)"/><text class="b" x="1136" y="644" text-anchor="end">65%</text></svg>
