<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Featured projects"><style>
text{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.name{font-size:108px;font-weight:800;fill:#ECECE6;letter-spacing:2px}
.ember{fill:#E4FF4A}
